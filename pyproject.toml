[project]
name = "gen"
version = "0.1.0"
description = "Generative media toolkit"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "playwright>=1.40",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[project.scripts]
gen = "gen.cli:main"

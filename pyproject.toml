[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gen"
version = "0.1.0"
description = "Generative media toolkit: Jinja2 HTML templates rendered to images via Playwright"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1,<4",
    "numpy>=1.24",
    "pillow>=10.0,<12",
    "playwright>=1.40,<2",
    "pyyaml>=6.0,<7",
    "scipy>=1.11",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.23"]
dev = ["ruff", "pytest", "pymupdf>=1.23"]

[project.scripts]
gen = "gen.cli:main"

# Only gen/ is a package; brands/, templates/, assets/, sprites/ and output/ are data
# directories read at runtime relative to the repo root, so auto-discovery must be told
# explicitly or it fails on the multiple top-level directories.
[tool.setuptools]
packages = ["gen"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

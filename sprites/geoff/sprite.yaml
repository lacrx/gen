name: geoff
size: 64

# Geoff: long-haired black and white cat. Solid black back and flank, bright white
# chest and front legs, black cap over the head and both ears, white face with a
# blaze, long black plume tail, green eyes, pink nose.
#
# Three-quarter view on purpose: front-on cannot show the black back and the white
# chest at the same time, and showing only the white front made him read as a
# generic tuxedo rather than as Geoff.
#
# idle was generated by Retro Diffusion (RD Pro, 64x64) from four reference photos
# of the real cat, then traced into this palette with `gen pixel trace`. The map is
# canonical from here: correct it by hand, do not regenerate over it.


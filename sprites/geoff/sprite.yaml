  "m": "#B3AAA0"
  "s": "#6B635C"
  "g": "#9BB77F"
  "p": "#E8A0A6"
  "d": "#15110F"
  # Prop colours. The sleeping frames are vignettes: the absurd container is the
  # joke, so a box or basket needs somewhere to live in the palette.
  "b": "#B5844E"  # cardboard / wicker
  "n": "#7A5632"  # prop shadow
  "t": "#8C9E6E"  # stray foliage


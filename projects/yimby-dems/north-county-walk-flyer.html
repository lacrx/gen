<title>YIMBY Democrats - September 2026 Meeting Flyer</title>
<style>
  :root {
    --green: #47A548;
    --green-dark: #3a8c3b;
    --yellow: #FFD600;
    --cyan: #2DD4BF;
    --white: #FFFFFF;
    --dark: #1a2a1a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #111;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  .poster {
    width: 540px;
    height: 675px;
    background: var(--green);
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }

  .frame {
    position: absolute;
    inset: 4px;
    border: none;
    border-radius: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header {
    padding: 32px 16px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    position: relative;
  }

  .title {
    font-family: 'Nunito', 'Arial Rounded MT Bold', 'Varela Round', sans-serif;
    font-size: 42px;
    font-weight: 900;
    color: var(--white);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.15);
    line-height: 1;
    letter-spacing: -0.5px;
    padding-left: 20px;
  }

  /* Sparkle decorations - extracted from original */
  .sparkles-overlay {
    position: absolute;
    top: -19px;
    left: -3px;
    width: 200px;
    height: 45px;
    pointer-events: none;
  }
  .sparkles-overlay img {
    width: 100%;
    height: 100%;
  }
  .sparkles-right {
    position: absolute;
    top: -15px;
    right: -35px;
    width: 160px;
    height: 36px;
    pointer-events: none;
  }
  .sparkles-right img {
    width: 100%;
    height: 100%;
  }

  .logo {
    width: 56px;
    height: auto;
    flex-shrink: 0;
    object-fit: contain;
  }

  /* Subtitle */
  .subtitle {
    padding: 4px 16px 6px 41px;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    font-weight: 800;
    font-size: 14px;
    color: var(--white);
    text-transform: uppercase;
    letter-spacing: 4px;
    transform: rotate(-1deg);
    transform-origin: left center;
  }

  /* Decorative yellow swoosh under header - extracted from original */
  .swoosh {
    margin: -2px 4px 2px;
    height: 16px;
    width: 55%;
    margin-left: 12px;
    position: relative;
  }
  .swoosh img {
    width: 100%;
    height: 100%;
  }

  /* Photo grid */
  .photo-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    grid-template-rows: 1fr;
    gap: 3px;
    padding: 3px 6px;
    flex: 1;
    margin: 0;
  }

  .photo {
    border-radius: 6px;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .photo-label {
    color: rgba(255,255,255,0.35);
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-align: center;
    padding: 4px;
  }

  .photo-1 {
    grid-row: 1;
    grid-column: 1;
    background: linear-gradient(135deg, #2a3a2a 0%, #3a4a35 50%, #2a3525 100%);
  }
  .photo-2 {
    grid-row: 1;
    grid-column: 2;
    background: linear-gradient(135deg, #3a3525 0%, #4a4535 50%, #3a3a2a 100%);
  }
  .photo-3 {
    grid-row: 1;
    grid-column: 3;
    background: linear-gradient(135deg, #352a25 0%, #453a35 50%, #3a302a 100%);
  }
  .photo-4 {
    grid-row: 1;
    grid-column: 1;
    background: linear-gradient(135deg, #2a3530 0%, #3a4540 50%, #2a3530 100%);
  }
  .photo-5 {
    grid-row: 1;
    grid-column: 2;
    background: linear-gradient(160deg, #3a2520 0%, #4a3530 40%, #1a1510 100%);
  }

  /* Warm light overlay to suggest indoor event photos */
  .photo::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 60% 40%, rgba(255,200,100,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Featured Speakers */
  .speakers-section {
    padding: 12px 10px 10px;
    position: relative;
    overflow: visible;
    margin-top: -80px;
  }

  .speakers-bg {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, var(--green) 0%, var(--green-dark) 100%);
  }

  .speakers-label {
    position: relative;
    font-family: 'Nunito', 'Arial Rounded MT Bold', 'Varela Round', sans-serif;
    font-size: 36px;
    font-weight: 900;
    color: var(--white);
    text-align: center;
    transform: rotate(-2deg);
    margin-bottom: 10px;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.1);
  }

  .speakers-row {
    position: relative;
    display: flex;
    justify-content: center;
    gap: 8px;
    padding-bottom: 2px;
  }

  .speaker {
    text-align: center;
    width: 140px;
    flex-shrink: 0;
  }

  .speaker-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    margin: 0 auto;
    border: 2px solid var(--cyan);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .speaker-img.person {
    background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
  }
  .speaker-img.org {
    background: var(--white);
  }

  .speaker-img svg {
    width: 24px;
    height: 24px;
    opacity: 0.5;
  }

  .speaker-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--white);
    margin-top: 4px;
    line-height: 1.2;
  }

  .speaker-role {
    font-size: 6px;
    color: var(--yellow);
    font-style: italic;
    line-height: 1.2;
  }

  /* Footer */
  .footer {
    position: relative;
    padding: 3px 10px;
    text-align: right;
    font-size: 6px;
    color: rgba(255,255,255,0.5);
    background: rgba(0,0,0,0.25);
    letter-spacing: 0.3px;
  }

  /* No dark/light theme toggle needed; this is a fixed poster design */
  @media (prefers-color-scheme: dark) {}
  :root[data-theme="dark"] {}
  :root[data-theme="light"] {}

  @media (max-width: 600px) {
    .poster {
      width: 100vw;
      height: calc(100vw * 1.25);
    }
    .title { font-size: 6vw; }
    .subtitle { font-size: 2.2vw; }
    .speakers-label { font-size: 5vw; }
  }
</style>
